[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "moneymaker-backend"
version = "0.1.0"
description = "MoneyMaker Trading Terminal — Python Sidecar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "duckdb>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "eth-account>=0.11.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
moneymaker-sidecar = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
